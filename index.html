<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B5E20">
<meta name="description" content="Zoology Hub — National University Honours 4th Year (2025 Exam, 2021-22) প্রাণিবিদ্যা প্রশ্নব্যাংক। ৮টি বিষয়, ক/খ/গ বিভাগ, 🔥 কমন প্রশ্ন চিহ্নিত।">
<title>Zoology Hub — প্রাণিবিদ্যা প্রশ্নব্যাংক</title>
<style>
/* ══════════════════════════════════════════════
   Zoology Hub — styles (vanilla CSS, no build step)
   ══════════════════════════════════════════════ */
:root{
  --font-bn:'Hind Siliguri','Noto Sans Bengali','Nirmala UI','Shonar Bangla','Kalpurush',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace;
  --accent:#1B5E20;
  --mid:#388E3C;
  --grad:linear-gradient(135deg,#1B5E20,#2E7D32);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:#e8f5e9;color:#1a1a1a;font-family:var(--font-bn);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;
}
button{font-family:inherit;font-size:inherit}
input,textarea{font-family:inherit}
.hidden{display:none!important}

.page{min-height:100vh;position:relative;padding-bottom:80px;background:var(--bg,#e8f5e9)}
.page-home{background:linear-gradient(145deg,#E8F5E9 0%,#E8EAF6 22%,#E1F5FE 45%,#F3E5F5 68%,#FFF8E1 100%)}

/* ───────── floating background icons ───────── */
.bg-wrap{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bg-icon{
  position:absolute;opacity:.048;user-select:none;line-height:1;will-change:transform;
  animation:bgFloat var(--dur,20s) var(--delay,0s) infinite ease-in-out;
}
@keyframes bgFloat{
  0%,100%{transform:translate(0,0) rotate(0deg)}
  50%{transform:translate(var(--dx,20px),var(--dy,20px)) rotate(var(--rot,8deg))}
}
@media (prefers-reduced-motion:reduce){.bg-icon{animation:none}}

/* ───────── glass base ───────── */
.glass{
  background:rgba(255,255,255,var(--go,.8));
  border:1px solid rgba(255,255,255,var(--bb,.3));
  backdrop-filter:blur(var(--gb,24px)) saturate(1.8);
  -webkit-backdrop-filter:blur(var(--gb,24px)) saturate(1.8);
}

/* ───────── hero / headers ───────── */
.hero{
  background:linear-gradient(155deg,rgba(3,3,16,.97) 0%,rgba(8,25,8,.93) 50%,rgba(3,12,30,.97) 100%);
  padding:34px 20px 28px;text-align:center;border-radius:0 0 42px 42px;
  box-shadow:0 16px 56px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.07);
  position:relative;z-index:10;
}
.eyebrow{font-size:8px;color:rgba(255,255,255,.45);letter-spacing:4px;font-family:var(--font-mono);margin-bottom:10px;text-transform:uppercase;line-height:1.6}
.hero-emoji{font-size:36px;margin-bottom:8px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5))}
.hero h1{margin:0 0 4px;color:#fff;font-size:clamp(20px,5.5vw,32px);font-weight:900;letter-spacing:-.6px;text-shadow:0 4px 20px rgba(0,0,0,.5)}
.hero .bn{color:rgba(165,214,167,.9);font-size:14px;font-weight:600}
.hero .sm{color:rgba(255,255,255,.45);font-size:11px;margin-top:2px}
.hero-badges{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}

.badge{--go:.13;--gb:14px;--bb:.22;border-radius:24px;padding:7px 16px;display:inline-flex;align-items:center;gap:7px}
.badge .t1{color:#fff;font-size:13px;font-weight:700;line-height:1.15}
.badge .t2{color:rgba(165,214,167,.8);font-size:10px}
.badge.gold{
  background:rgba(255,200,0,.13);border:1px solid rgba(255,200,0,.3);border-radius:24px;
  padding:7px 14px;display:inline-flex;align-items:center;gap:5px;
  color:#FFD54F;font-size:11px;font-weight:600;backdrop-filter:none;-webkit-backdrop-filter:none;
}

/* subject header */
.subhead{
  padding:22px 16px 18px;text-align:center;position:relative;z-index:10;
  border-radius:0 0 32px 32px;
  box-shadow:0 12px 48px rgba(0,0,0,.36),inset 0 1px 0 rgba(255,255,255,.1);
}
.subhead .eyebrow{letter-spacing:3.5px;margin-bottom:6px}
.sub-name{margin:0 0 2px;color:#fff;font-size:clamp(13px,3.5vw,19px);font-weight:900;letter-spacing:-.3px;text-shadow:0 2px 12px rgba(0,0,0,.4)}
.sub-bn{color:rgba(255,255,255,.7);font-size:12px;margin-bottom:8px}
.pill{--go:.12;--gb:14px;--bb:.22;border-radius:18px;padding:5px 14px;display:inline-flex;align-items:center;gap:6px;color:#fff;font-size:12px;font-weight:600}
.backbtn{
  position:absolute;left:14px;top:18px;--go:.14;--gb:12px;--bb:.24;
  border-radius:14px;padding:6px 13px;cursor:pointer;color:#fff;font-size:13px;font-weight:600;
  display:inline-flex;align-items:center;gap:4px;
}
.backbtn:hover{background:rgba(255,255,255,.24)}

/* ───────── layout ───────── */
.wrap{max-width:720px;margin:0 auto;padding:0 14px;position:relative;z-index:10}
.wrap-home{padding-top:16px}

/* ───────── search bar ───────── */
.searchbar{
  --go:.88;--gb:24px;--bb:.7;
  border-radius:22px;padding:12px 18px;display:flex;align-items:center;gap:12px;
  box-shadow:0 4px 22px rgba(0,0,0,.1);margin-top:16px;transition:box-shadow .22s,border-color .22s;
}
.searchbar .ico{font-size:18px;opacity:.4;line-height:1}
.searchbar input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:15px;color:#1a1a1a;padding:2px 0}
.searchbar input::placeholder{color:#9aa0a6}
.searchbar:focus-within{box-shadow:0 6px 26px rgba(0,0,0,.16);border-color:rgba(0,0,0,.16)}
.clearbtn{
  background:rgba(0,0,0,.07);border:none;border-radius:50%;width:26px;height:26px;cursor:pointer;
  font-size:13px;display:flex;align-items:center;justify-content:center;color:#333;flex-shrink:0;
}
.clearbtn:hover{background:rgba(0,0,0,.12)}
.searchinfo{text-align:center;font-size:11px;color:#888;margin-top:4px;min-height:0}
.searchinfo strong{color:var(--accent)}

/* ───────── home stats ───────── */
.mega-stats{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.mega{--go:.82;--gb:18px;--bb:.58;border-radius:14px;padding:8px 16px;text-align:center;min-width:92px}
.mega .v{font-size:20px;font-weight:900;color:#1B5E20;line-height:1}
.mega .l{font-size:10px;color:#888;margin-top:1px}

/* ───────── subject grid ───────── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:16px}
.subj{
  --go:.82;--gb:22px;--bb:.5;
  border-radius:22px;padding:16px 18px;border:1px solid rgba(255,255,255,.5);cursor:pointer;text-align:left;
  box-shadow:0 4px 18px rgba(0,0,0,.08),inset 0 1px 0 rgba(255,255,255,.82);
  transition:transform .28s cubic-bezier(.4,0,.2,1),box-shadow .28s;
  display:block;width:100%;color:inherit;
}
.subj:hover,.subj:focus-visible{
  transform:translateY(-3px) scale(1.015);
  box-shadow:0 12px 36px rgba(0,0,0,.14),0 0 0 1.5px color-mix(in srgb,var(--accent) 45%,transparent);
  outline:none;
}
.subj-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.subj-ico{width:46px;height:46px;border-radius:15px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 4px 12px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.2);flex-shrink:0}
.subj-name{font-size:13px;font-weight:800;color:#1a1a1a;line-height:1.3;letter-spacing:-.2px}
.subj-bn{font-size:11px;color:#777;margin-top:1px}
.subj-bot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.subj-tags{display:flex;gap:6px;flex-wrap:wrap}
.tag-code{background:rgba(0,0,0,.05);color:var(--accent);border-radius:8px;padding:3px 10px;font-size:11px;font-weight:700;font-family:var(--font-mono)}
.tag-info{background:rgba(0,0,0,.06);color:#666;border-radius:8px;padding:3px 10px;font-size:10px}
.subj-arrow{width:28px;height:28px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.empty{text-align:center;padding:48px 16px;color:#bbb;font-size:16px}

/* ───────── tabs ───────── */
.tabs{
  --go:.76;--gb:20px;--bb:.52;margin-top:12px;border-radius:20px;padding:4px;display:flex;gap:3px;
  box-shadow:0 2px 12px rgba(0,0,0,.07),inset 0 1px 0 rgba(255,255,255,.85);
}
.tab{
  flex:1;padding:9px 4px;border-radius:16px;border:none;background:transparent;cursor:pointer;color:#555;
  font-weight:500;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:1px;
  transition:all .26s cubic-bezier(.4,0,.2,1);
}
.tab .l{font-size:12px;font-weight:700}
.tab .s{font-size:9px;opacity:.55}
.tab:hover{background:rgba(0,0,0,.04)}
.tab.on{background:var(--grad);color:#fff;font-weight:700;box-shadow:0 3px 12px rgba(0,0,0,.2);transform:scale(1.03)}
.tab.on .s{opacity:.85}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ───────── stats row ───────── */
.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.stat{--go:.82;--gb:20px;--bb:.6;border-radius:15px;padding:8px 16px;text-align:center;flex:1 0 70px;max-width:120px}
.stat .v{font-size:22px;font-weight:900;line-height:1;color:var(--accent)}
.stat .v.red{color:#E53935}
.stat .l{font-size:10px;color:#999;margin-top:2px}
.copybtn{
  background:var(--grad);color:#fff;border:none;border-radius:15px;padding:8px 16px;cursor:pointer;
  font-weight:700;font-size:11px;box-shadow:0 3px 14px rgba(0,0,0,.16);flex:1 0 70px;max-width:110px;
}
.copybtn:hover{filter:brightness(1.08)}
.copybtn:active{transform:scale(.97)}

/* ───────── chapter cards ───────── */
.card{
  --go:.78;--gb:22px;--bb:.42;
  border-radius:20px;overflow:hidden;margin-bottom:10px;margin-top:10px;
  box-shadow:0 2px 14px rgba(0,0,0,.07);
  transition:box-shadow .3s,background .3s;
}
.card.open{--go:.92;--gb:32px;--bb:.7;box-shadow:0 10px 36px rgba(0,0,0,.13)}
.card-head{
  width:100%;border:none;background:transparent;cursor:pointer;text-align:left;padding:13px 16px;
  display:flex;align-items:center;gap:10px;transition:background .28s;
}
.card-head:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.card-emoji{font-size:18px;flex-shrink:0;line-height:1}
.card-mid{flex:1;min-width:0}
.card-id{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--accent);opacity:.65;text-transform:uppercase;font-family:var(--font-mono);margin-bottom:2px}
.card.open .card-id{opacity:1}
.card-title{font-weight:700;font-size:13px;color:#1a1a1a;line-height:1.35;letter-spacing:-.2px}
.card-badges{display:flex;align-items:center;gap:5px;flex-shrink:0}
.badge-hot{background:rgba(229,57,53,.12);color:#C62828;border-radius:9px;padding:2px 8px;font-size:10px;font-weight:700}
.badge-count{background:rgba(0,0,0,.06);color:var(--accent);border-radius:9px;padding:2px 8px;font-size:10px;font-weight:700;transition:all .25s}
.card.open .badge-count{background:var(--grad);color:#fff}
.chev{color:var(--accent);font-size:16px;display:inline-block;transition:transform .28s;line-height:1}
.card.open .chev{transform:rotate(180deg);color:#555}
.card-body{border-top:1px solid rgba(0,0,0,.05)}
.qrow{display:flex;align-items:flex-start;gap:10px;padding:10px 16px;border-bottom:1px solid rgba(0,0,0,.045);transition:background .15s}
.qrow:last-child{border-bottom:none}
.qrow.hot{background:rgba(255,253,231,.65)}
.qrow:not(.hot):hover{background:rgba(0,0,0,.025)}
.qnum{
  min-width:28px;height:28px;border-radius:9px;background:var(--grad);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;
  font-family:var(--font-mono);flex-shrink:0;margin-top:1px;box-shadow:0 2px 5px rgba(0,0,0,.14);
}
.qrow.hot .qnum{background:linear-gradient(135deg,#E53935,#EF5350);box-shadow:0 2px 7px rgba(229,57,53,.36)}
.qtext{font-size:14px;color:#1a1a1a;line-height:1.7;letter-spacing:-.1px}
.qrow.hot .qtext{font-weight:500}
.hotpill{
  display:inline-flex;align-items:center;gap:2px;margin-left:7px;
  background:linear-gradient(135deg,#E53935,#EF5350);color:#fff;font-size:9px;
  border-radius:7px;padding:1px 6px;font-weight:700;vertical-align:middle;letter-spacing:.3px;
}
mark{background:#FFF176;border-radius:3px;padding:0 2px;color:inherit}

/* ───────── footer ───────── */
.foot{text-align:center;margin-top:44px;padding:0 16px;position:relative;z-index:10}
.foot-inner{--go:.87;--gb:28px;--bb:.68;border-radius:26px;padding:20px 26px;display:inline-block;max-width:460px;width:100%;box-shadow:0 6px 28px rgba(0,0,0,.08)}
.foot-icons{display:flex;justify-content:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.foot-icons span{font-size:19px;opacity:.7}
.foot-line{height:1px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.08),transparent);margin:10px 0}
.foot-name{font-size:14px;color:var(--accent);font-weight:700;letter-spacing:-.2px;margin-bottom:2px}
.foot-sub{font-size:12px;color:#444;font-weight:600}
.foot-cc{font-size:10px;color:#bbb;font-family:var(--font-mono)}

/* ───────── toast + modal ───────── */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(18px);
  background:rgba(20,20,30,.93);color:#fff;padding:11px 20px;border-radius:14px;font-size:13px;font-weight:600;
  z-index:9999;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
  box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:90vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9998}
.modal[hidden]{display:none}
.modal-box{background:#fff;border-radius:20px;padding:18px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.modal-box h3{margin:0 0 4px;font-size:15px}
.modal-box p{margin:0 0 10px;font-size:11px;color:#888}
.modal-box textarea{width:100%;height:46vh;border-radius:12px;border:1px solid #ddd;padding:10px;font-size:12px;line-height:1.6;resize:vertical;font-family:var(--font-mono)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.btn{border:none;border-radius:12px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;background:#eee;color:#333}
.btn.primary{background:#1B5E20;color:#fff}

/* ───────── small screens ───────── */
@media (max-width:420px){
  .hero{padding:26px 16px 22px;border-radius:0 0 32px 32px}
  .grid{grid-template-columns:1fr}
  .backbtn{top:14px;left:10px;padding:5px 10px;font-size:12px}
  .qtext{font-size:13.5px}
  .stat{max-width:none}
  .copybtn{max-width:none}
}
@media print{
  .bg-wrap,.searchbar,.tabs,.copybtn,.backbtn,.foot{display:none!important}
  .card,.card-body{display:block!important}
  .page{background:#fff}
}

/* ───────── v2 additions ───────── */
[hidden]{display:none!important}
.subj-name,.subj-bn,.card-id,.card-title{display:block}
.card-mid{display:block}
.list-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 4px 2px}
.list-title{font-size:12px;font-weight:800;color:#555;letter-spacing:.3px}
.linkbtn{
  background:rgba(255,255,255,.75);border:1px solid rgba(0,0,0,.07);border-radius:10px;
  padding:4px 12px;font-size:11px;font-weight:700;color:var(--accent);cursor:pointer;transition:all .18s;
}
.linkbtn:hover{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.linkbtn:disabled{opacity:.45;cursor:default;box-shadow:none}
.subj{cursor:pointer}
.subj:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.qtext mark{background:#FFF176;border-radius:3px;padding:0 2px}

/* ───────── mobile header fixes (v3) ───────── */
@media (max-width:600px){
  .subhead{padding-top:58px}
  .backbtn{top:12px;left:12px}
  .subhead .eyebrow{font-size:7px;letter-spacing:2px;padding:0 10px}
  .hero .eyebrow{font-size:7px;letter-spacing:2.5px;padding:0 6px}
  .hero-badges{gap:8px}
  .badge .t1{font-size:12px}
}
@media (max-width:380px){
  .sub-name{font-size:14px}
  .foot-inner{padding:16px 16px}
}

</style>
</head>

<div id="app"></div>
<noscript>
  <div style="padding:24px;font-family:system-ui,sans-serif;text-align:center">
    এই অ্যাপটি চালাতে জাভাস্ক্রিপ্ট চালু করুন।
  </div>
</noscript>
<script>
/* ══════════════════════════════════════════════
   Zoology Hub — ডেটা (প্রশ্নব্যাংক)
   National University · Honours 4th Year · 2025 Exam · 2021-22
   সম্পূর্ণ প্লেইন JavaScript — কোনো ফ্রেমওয়ার্ক নেই।
   hot: true মানে 🔥 ১০০% কমন (গুরুত্বপূর্ণ) প্রশ্ন
══════════════════════════════════════════════ */

const SUBJECTS = [
  { id:"AEZ", code:"243101", name:"Applied & Economic Zoology", bn:"এপ্লাইড ও ইকোনমিক জুওলজি", emoji:"🐝", grad:"linear-gradient(135deg,#1B5E20,#2E7D32)", accent:"#1B5E20", mid:"#388E3C", bg:"linear-gradient(145deg,#E8F5E9 0%,#F1F8E9 100%)" },
  { id:"GEB", code:"243103", name:"Genetic Engineering & Biotechnology", bn:"জেনেটিক ইঞ্জিনিয়ারিং ও বায়োটেকনোলজি", emoji:"🧬", grad:"linear-gradient(135deg,#1A237E,#283593)", accent:"#1A237E", mid:"#303F9F", bg:"linear-gradient(145deg,#E8EAF6 0%,#EDE7F6 100%)" },
  { id:"BSR", code:"243105", name:"Biostatistics & Research Methodology", bn:"বায়োস্ট্যাটিস্টিক্স ও রিসার্চ মেথডলজি", emoji:"📊", grad:"linear-gradient(135deg,#004D40,#00695C)", accent:"#004D40", mid:"#00796B", bg:"linear-gradient(145deg,#E0F2F1 0%,#E8F5E9 100%)" },
  { id:"MRB", code:"243107", name:"Microbiology & Radiation Biology", bn:"মাইক্রোবায়োলজি ও রেডিয়েশন বায়োলজি", emoji:"🦠", grad:"linear-gradient(135deg,#4A148C,#6A1B9A)", accent:"#4A148C", mid:"#7B1FA2", bg:"linear-gradient(145deg,#F3E5F5 0%,#EDE7F6 100%)" },

  const BG_ICONS = ["🧬","🔬","🐟","🦐","🐝","🦋","🐄","🌿","🦠","⚗️","🐡","🌊","🐍","🦅","🐊","🌾","🦀","🐚","🐬","🧪","🦁","🦎","🐢","🎣","🦜","🐸","🌺","🦩"];

  const BN_DIGITS = "০১২৩৪৫৬৭৮৯";
  const bn = (n) => String(n).replace(/\d/g, (d) => BN_DIGITS[+d]);

  /** HTML-escape */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
    );
  }

  /** বাংলা-বান্ধব সার্চ কী — কেস + যুক্তাক্ষর/কার-চিহ্ন সহজ করে */
  function norm(s) {
    return String(s == null ? "" : s)
      .toLowerCase()
      .normalize("NFC")
      .replace(/[\u200c\u200d]/g, "")          /* ZWJ / ZWNJ বাদ */
      .replace(/[\u09bc\u0981\u0982\u0983\u09cd]/g, ""); /* ় ঁ ং ঃ ্ বাদ */
  }

  const matches = (text, q) => norm(text).includes(norm(q));

  /** সার্চ টার্ম হাইলাইট (নিরাপদভাবে escape করে) */
  function highlight(text, q) {
    if (!q) return esc(text);
    const i = String(text).toLowerCase().indexOf(String(q).toLowerCase());
    if (i === -1) return esc(text);
    const t = String(text);
    return esc(t.slice(0, i)) + "<mark>" + esc(t.slice(i, i + q.length)) + "</mark>" + esc(t.slice(i + q.length));
  }

  /** deterministic random — প্রতিবার একই ব্যাকগ্রাউন্ড */
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* ────────────────────────── background ────────────────────────── */
  function floatingBg() {
    const rnd = mulberry32(20261025);
    let out = '<div class="bg-wrap" aria-hidden="true">';
    for (let i = 0; i < 30; i++) {
      const icon = BG_ICONS[i % BG_ICONS.length];
      const x = (rnd() * 100).toFixed(2);
      const y = (rnd() * 100).toFixed(2);
      const sz = 10 + rnd() * 15;
      const dur = 14 + rnd() * 22;
      const delay = rnd() * 16;
      const dx = ((rnd() - 0.5) * 75).toFixed(1);
      const dy = ((rnd() - 0.5) * 75).toFixed(1);
      const rot = ((rnd() - 0.5) * 30).toFixed(1);
      out += `<span class="bg-icon" style="left:${x}%;top:${y}%;font-size:${sz.toFixed(1)}px;` +
        `--dur:${dur.toFixed(1)}s;--delay:${delay.toFixed(1)}s;--dx:${dx}px;--dy:${dy}px;--rot:${rot}deg">${icon}</span>`;
    }
    return out + "</div>";
  }

  function applySubjectTheme(subj) {
    document.documentElement.style.setProperty("--accent", subj.accent);
    document.documentElement.style.setProperty("--mid", subj.mid);
    document.documentElement.style.setProperty("--grad", subj.grad);
  }

  function divQuestions(subj, divKey) {
    return (DATA[subj.id] || []).flatMap((ch) => ch[divKey] || []);
  }

  function visibleCount(subj, divKey, q) {
    if (!q) return divQuestions(subj, divKey).length;
    return (DATA[subj.id] || []).reduce((a, ch) => {
      const qs = ch[divKey] || [];
      if (matches(ch.title, q)) return a + qs.length;
      return a + qs.filter((it) => matches(it.q, q)).length;
    }, 0);
  }

  function subjectStatsHtml(subj) {
    const q = state.search.trim();
    const all = divQuestions(subj, state.div);
    const hot = all.filter((x) => x.hot).length;
    const total = q ? visibleCount(subj, state.div, q) : all.length;
    return `
      <div class="stat glass">
        <div class="v">${bn(total)}</div>
        <div class="l">মোট প্রশ্ন</div>
      </div>
      <div class="stat glass">
        <div class="v red">${bn(hot)}</div>
        <div class="l">${esc(CONFIG.hotStatLabel)}</div>
      </div>
      <button class="copybtn" data-act="copy">📋 কপি করো</button>`;
  }

  function chaptersHtml(subj) {
    const q = state.search.trim();
    const chapters = DATA[subj.id] || [];
    let out = "";
    let shown = 0;
    chapters.forEach((ch) => {
      const html = cardHtml(ch, subj, state.div, q);
      if (html) { out += html; shown++; }
    });
    if (!shown) {
      out = `<div class="empty">🔍 এই বিভাগে কোনো প্রশ্ন পাওয়া যায়নি</div>`;
    }
    return out;
  }

  function cardHtml(ch, subj, divKey, q) {
    const qs = ch[divKey] || [];
    if (!qs.length) return "";
    const titleHit = q ? matches(ch.title, q) : false;
    const vis = !q ? qs : titleHit ? qs : qs.filter((it) => matches(it.q, q));
    if (q && !vis.length) return "";

    const hot = vis.filter((i) => i.hot).length;
    const isOpen = q ? true : state.open.has(ch.id);

    const rows = vis.map((it, i) => `
      <div class="qrow${it.hot ? " hot" : ""}">
        <div class="qnum">${String(i + 1).padStart(2, "0")}</div>
        <div class="qtext">${highlight(it.q, q)}${it.hot ? `<span class="hotpill">${esc(CONFIG.hotLabel)}</span>` : ""}</div>
      </div>`).join("");

    return `
      <div class="card glass${isOpen ? " open" : ""}" data-card="${ch.id}">
        <button class="card-head" data-act="toggle" data-id="${ch.id}" aria-expanded="${isOpen}">
          <span class="card-emoji">${ch.emoji}</span>
          <span class="card-mid">
            <span class="card-id">${esc(ch.id)}</span>
            <span class="card-title">${esc(ch.title)}</span>
          </span>
          <span class="card-badges">
            ${hot > 0 ? `<span class="badge-hot">🔥${bn(hot)}</span>` : ""}
            <span class="badge-count">${bn(vis.length)}টি</span>
            <span class="chev">▾</span>
          </span>
        </button>
        <div class="card-body"${isOpen ? "" : " hidden"}>${rows}</div>
      </div>`;
  }

  function updateSubjectInfo() {
    const subj = state.subj;
    if (!subj) return;
    const q = state.search.trim();
    const info = $("#searchInfo");
    if (info) {

        ? `<strong>${bn(visibleCount(subj, state.div, q))}টি</strong> প্রশ্ন পাওয়া গেছে`

    const sw = $("#statsWrap");

    const cl = $("#chapterList");

      t.classList.toggle("on", t.dataset.div === state.div);
    });
    updateToggleAllLabel();

  function updateToggleAllLabel() {
    const btn = $('[data-act="toggle-all"]');
    if (!btn) return;
    const q = state.search.trim();
    const ids = (DATA[state.subj.id] || [])
      .filter((ch) => (ch[state.div] || []).length)
      .map((ch) => ch.id);
    const allOpen = ids.length > 0 && ids.every((id) => state.open.has(id));
    btn.textContent = q ? "সার্চ রেজাল্ট" : allOpen ? "সব বন্ধ করো" : "সব খুলুন";
    btn.disabled = !!q;
  }

  /* ────────────────────────── copy ────────────────────────── */
  function buildCopyText(subj, divKey) {
    const div = DIVS.find((d) => d.key === divKey);
    let t = `${subj.name} (${subj.code}) — ${div.label}\n` +
      `National University · 4th Year · 2025 Exam · 2021-22\n` +
      `${CONFIG.collegeBn} · ${CONFIG.deptBn}\n` +
      "═".repeat(46) + "\n\n";

    (DATA[subj.id] || []).forEach((ch) => {
      const qs = ch[divKey] || [];
      if (!qs.length) return;
      t += `${ch.emoji} ${ch.title}\n${"─".repeat(36)}\n`;
      qs.forEach((it, i) => {
        t += `${i + 1}. ${it.q}${it.hot ? CONFIG.hotCopyTag : ""}\n`;
      });
      t += "\n";
    });
    return t;
  }

  async function copyText(text) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        toast("✅ কপি হয়েছে!");
        return;
      }
      throw new Error("clipboard unavailable");
    } catch (e) {
      // fallback: লুকানো textarea
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.cssText = "position:fixed;left:-9999px;top:0";
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch (_) { ok = false; }
      document.body.removeChild(ta);
      if (ok) toast("✅ কপি হয়েছে!");
      else showCopyModal(text);
    }
  }

  /* ────────────────────────── toast ────────────────────────── */
  let toastEl = null, toastTimer = null;
  function toast(msg) {
    if (!toastEl) {
      toastEl = document.createElement("div");
      toastEl.className = "toast";
      toastEl.setAttribute("role", "status");
      toastEl.setAttribute("aria-live", "polite");
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2200);
  }

  /* ────────────────────────── copy modal ────────────────────────── */
  let modalEl = null;
  function showCopyModal(text) {
    if (!modalEl) {
      modalEl = document.createElement("div");
      modalEl.className = "modal";
      modalEl.hidden = true;
      modalEl.innerHTML = `
        <div class="modal-box" role="dialog" aria-modal="true" aria-label="কপি">
          <h3>📋 কপি করো</h3>
          <p>নিচের লেখাটুকু সিলেক্ট করে Ctrl/Cmd + C দিয়ে কপি করো।</p>
          <textarea readonly></textarea>
          <div class="modal-actions">
            <button class="btn" data-act="modal-close">বন্ধ করো</button>
            <button class="btn primary" data-act="modal-select">সব সিলেক্ট</button>
          </div>
        </div>`;
      document.body.appendChild(modalEl);
      modalEl.addEventListener("click", (e) => {
        if (e.target === modalEl) closeModal();
        const act = e.target.closest("[data-act]");
        if (!act) return;
        if (act.dataset.act === "modal-close") closeModal();
        if (act.dataset.act === "modal-select") {
          const ta = $("textarea", modalEl);
          ta.focus(); ta.select();
        }
      });
    }
    $("textarea", modalEl).value = text;
    modalEl.hidden = false;
    setTimeout(() => $("textarea", modalEl).focus(), 30);
  }
  function closeModal() { if (modalEl) modalEl.hidden = true; }

  /* ────────────────────────── routing ────────────────────────── */
  function route() {
    const h = location.hash || "#/home";
    const m = h.match(/^#\/s\/([A-Za-z]+)(?:\/(ka|kha|ga))?/);
    if (m) {
      const subj = SUBJECTS.find((s) => s.id === m[1]);
      if (subj) {
        const keep = state.subj && state.subj.id === subj.id;
        renderSubject(subj, m[2] || "ka", keep);
        window.scrollTo(0, 0);
        return;
      }
    }
    renderHome();
    window.scrollTo(0, 0);
  }

  function openSubject(id) {
    location.hash = `#/s/${id}/ka`;
  }

  function goHome() {
    history.replaceState(null, "", "#/home");
    renderHome();
    window.scrollTo(0, 0);
  }

  function setDiv(key) {
    if (!state.subj || state.div === key) return;
    state.div = key;
    state.search = "";
    const inp = $("#subjSearch");
    if (inp) inp.value = "";
    const clearBtn = $('[data-act="clear-subj"]');
    if (clearBtn) clearBtn.hidden = true;
    // প্রথম অধ্যায় খুলে দিই
    state.open = new Set();
    const first = (DATA[state.subj.id] || []).find((ch) => (ch[key] || []).length);
    if (first) state.open.add(first.id);
    history.replaceState(null, "", `#/s/${state.subj.id}/${key}`);
    updateSubjectInfo();
  }

  /* ────────────────────────── events ────────────────────────── */
  app.addEventListener("click", (e) => {
    /* home: বিষয় কার্ড (button বা role=button) */
    const subjCard = e.target.closest('[data-act="open-subject"]');
    if (subjCard) { openSubject(subjCard.dataset.id); return; }

    const el = e.target.closest("[data-act]");
    if (!el) return;
    const act = el.dataset.act;

    if (act === "back") { goHome(); return; }

    if (act === "clear-home") {
      const inp = $("#homeSearch");
      if (inp) { inp.value = ""; inp.focus(); }
      refreshHome("");
      return;
    }

    if (act === "clear-subj") {
      const inp = $("#subjSearch");
      if (inp) { inp.value = ""; inp.focus(); }
      state.search = "";
      const btn = $('[data-act="clear-subj"]');
      if (btn) btn.hidden = true;
      updateSubjectInfo();
      return;
    }

    if (act === "toggle") {
      if (state.search.trim()) return;         // সার্চের সময় সব খোলা
      const id = el.dataset.id;
      const card = el.closest(".card");
      const willOpen = !state.open.has(id);
      if (willOpen) state.open.add(id); else state.open.delete(id);
      if (card) {
        card.classList.toggle("open", willOpen);
        const body = $(".card-body", card);
        if (body) body.hidden = !willOpen;
      }
      el.setAttribute("aria-expanded", String(willOpen));
      updateToggleAllLabel();
      return;
    }

    if (act === "toggle-all") {
      if (!state.subj || state.search.trim()) return;
      const chapters = (DATA[state.subj.id] || []).filter((ch) => (ch[state.div] || []).length);
      const allOpen = chapters.every((ch) => state.open.has(ch.id));
      state.open = new Set(allOpen ? [] : chapters.map((ch) => ch.id));
      const list = $("#chapterList");
      if (list) list.innerHTML = chaptersHtml(state.subj);
      updateToggleAllLabel();
      return;
    }

    if (act === "copy") {
      if (!state.subj) return;
      copyText(buildCopyText(state.subj, state.div));
      return;
    }

    if (act === "modal-close") closeModal();
  });

  /* tab ক্লিক (delegation) */
  app.addEventListener("click", (e) => {
    const tab = e.target.closest(".tab[data-div]");
    if (!tab) return;
    setDiv(tab.dataset.div);
  });

  /* keyboard: subject card-এ Enter/Space */
  app.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const card = e.target.closest('[data-act="open-subject"]');
    if (card) { e.preventDefault(); openSubject(card.dataset.id); }
  });

  /* সার্চ: ইনপুট ফোকাস নষ্ট না করে শুধু লিস্ট আপডেট */
  app.addEventListener("input", (e) => {
    const t = e.target;
    if (t.id === "homeSearch") { refreshHome(t.value); return; }
    if (t.id === "subjSearch") {
      state.search = t.value;
      const clearBtn = $('[data-act="clear-subj"]');
      if (clearBtn) clearBtn.hidden = !t.value;
      updateSubjectInfo();
    }
  });

  /* Escape → মডাল বন্ধ / সার্চ রিসেট */
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      if (modalEl && !modalEl.hidden) { closeModal(); return; }
    }
  });

  /* browser back/forward */
  window.addEventListener("hashchange", route);

  /* ────────────────────────── init ────────────────────────── */
  if (!location.hash) history.replaceState(null, "", "#/home");
  route();
})();

</script>

</body>
</html>
